services:
  weather-web:
    image: weather-app:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # The credential is supplied from the environment and never baked into the image.
      WeatherApi__Credential: ${WEATHERAPI_CREDENTIAL:?WEATHERAPI_CREDENTIAL is required, see .env.example}
      ConnectionStrings__Redis: redis:6379
      Weather__BackgroundRefresh__Enabled: "true"
    depends_on:
      redis:
        condition: service_healthy
    # Container hardening: no privilege escalation, no Linux capabilities, immutable root filesystem.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - weather-keys:/keys
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # Started directly as the redis user: with all capabilities dropped the image entrypoint cannot
    # drop privileges itself, so the container has to be unprivileged from the start.
    user: redis
    # Not published to the host: only the application needs to reach it.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /data:rw,noexec,nosuid,size=8m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  weather-keys:
