name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore WeatherApp.slnx
      - name: Format
        run: dotnet format WeatherApp.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build WeatherApp.slnx --no-restore
      - name: Test
        run: dotnet test WeatherApp.slnx --no-build --collect:"XPlat Code Coverage"
      - name: Vulnerable packages
        run: dotnet list WeatherApp.slnx package --vulnerable --include-transitive

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - name: Docker build
        run: docker build -t weather-app:ci .

  performance:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != ''
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore WeatherApp.slnx
      - name: Performance smoke
        run: dotnet test tests/Weather.PerformanceTests/Weather.PerformanceTests.csproj --configuration Release
